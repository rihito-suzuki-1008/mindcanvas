<script>
const Home = {
  openingId:null,
  init(){
    document.getElementById('home-new').addEventListener('click',()=>this.newModal());
  },
  show(){
    this.openingId=null;
    App.screen='home';
    document.getElementById('editor').hidden=true;
    document.getElementById('home').hidden=false;
    this.render();
    Store.refreshFromDrive(()=>this.render());
  },
  fmt(ts){ if(!ts) return ''; const d=new Date(ts); const p=(x)=>('0'+x).slice(-2);
    return d.getFullYear()+'/'+p(d.getMonth()+1)+'/'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes()); },

  render(){
    const list=Store.listLocal().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    const wrap=document.getElementById('home-list'); const empty=document.getElementById('home-empty');
    wrap.innerHTML=''; empty.hidden=list.length>0;
    list.forEach(m=>{
      const busy=!!this.openingId, loading=this.openingId===m.id;
      const card=document.createElement('div'); card.className='card'+(loading?' loading':(busy?' busy':''));
      if(loading) card.setAttribute('aria-busy','true');
      card.innerHTML=
        '<div class="card-thumb">'+iconSvg(m.mode==='tree'?'tree':'freeform','thumb-icon')+
          (loading?'<div class="card-loading"><span class="spin"></span><span>読み込み中</span></div>':'')+
        '</div>'+
        '<div class="card-body">'+
          '<div class="card-title">'+escAttr(m.name)+'</div>'+
          '<div class="card-meta"><span>'+this.fmt(m.updatedAt)+'</span>'+
            '<span class="card-mode">'+(m.mode==='tree'?'ツリー':'フリー')+'</span></div>'+
          '<div class="card-actions">'+
            '<button data-a="open" '+(busy?'disabled':'')+'>'+(loading?'<span class="spin small"></span>開いています':'開く')+'</button>'+
            '<button data-a="dup" '+(busy?'disabled':'')+'>複製</button>'+
            '<button data-a="del" '+(busy?'disabled':'')+'>削除</button>'+
          '</div>'+
        '</div>';
      card.querySelector('[data-a="open"]').onclick=(e)=>{ e.stopPropagation(); this.open(m.id); };
      card.querySelector('[data-a="dup"]').onclick=(e)=>{ e.stopPropagation(); this.duplicate(m.id); };
      card.querySelector('[data-a="del"]').onclick=(e)=>{ e.stopPropagation(); this.remove(m.id, m.name); };
      card.addEventListener('dblclick',()=>this.open(m.id));
      wrap.appendChild(card);
    });
  },

  open(id){
    if(this.openingId) return;
    this.openingId=id; this.render();
    Store.loadProject(id,(p)=>{
      this.openingId=null;
      if(p) App.enterEditor(p);
      else { this.render(); App.toast('プロジェクトを開けませんでした'); }
    });
  },
  duplicate(id){
    if(this.openingId) return;
    Store.loadProject(id,(p)=>{ if(!p) return;
      const copy=mcClone(p); copy.id=uid('pj'); copy.name=(p.name||'無題')+' のコピー';
      copy.createdAt=Date.now(); copy.updatedAt=Date.now();
      Store.saveAndBackup(copy); this.render(); App.toast('複製しました');
    });
  },
  async remove(id,name){
    if(this.openingId) return;
    const ok=await Dialog.confirm('プロジェクトを削除', '「'+(name||'このプロジェクト')+'」を削除します。この操作は元に戻せません。', {danger:true, okText:'削除'});
    if(!ok) return;
    Store.deleteProject(id); this.render(); App.toast('削除しました');
  },

  newModal(){
    const root=document.getElementById('modal-root');
    const mask=document.createElement('div'); mask.className='modal-mask';
    mask.innerHTML=
      '<div class="modal">'+
        '<h2>新規プロジェクト</h2><p class="sub">ツリーとフリーフォームはキャンバス上で自由に混在できます（左のツールバーで切替）。</p>'+
        '<label class="fld">プロジェクト名</label>'+
        '<input class="txt" id="np-name" placeholder="無題のプロジェクト" />'+
        '<div class="modal-actions"><button class="btn" data-x="cancel">キャンセル</button>'+
        '<button class="btn btn-primary" data-x="create">作成</button></div>'+
      '</div>';
    const close=()=>mask.remove();
    mask.querySelector('[data-x="cancel"]').onclick=close;
    mask.querySelector('[data-x="create"]').onclick=()=>{
      const name=(mask.querySelector('#np-name').value||'').trim()||'無題のプロジェクト';
      close(); this.create(name);
    };
    mask.addEventListener('pointerdown',(e)=>{ if(e.target===mask) close(); });
    root.appendChild(mask);
    setTimeout(()=>mask.querySelector('#np-name').focus(),0);
  },
  create(name){
    const p=State.newProject(name);
    Store.saveAndBackup(p);
    App.enterEditor(p);
  }
};
</script>
