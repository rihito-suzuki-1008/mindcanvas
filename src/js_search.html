<script>
const Search = {
  box:null, input:null, count:null, matches:[], idx:-1,
  init(){
    this.box=document.getElementById('search-box');
    this.input=document.getElementById('search-input');
    this.count=document.getElementById('search-count');
    this.input.addEventListener('input', debounce(()=>this.run(),150));
    this.input.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){ e.preventDefault(); e.shiftKey?this.prev():this.next(); }
      else if(e.key==='Escape'){ e.preventDefault(); this.close(); }
      e.stopPropagation();
    });
    document.getElementById('search-next').addEventListener('click',()=>this.next());
    document.getElementById('search-prev').addEventListener('click',()=>this.prev());
    document.getElementById('search-close').addEventListener('click',()=>this.close());
  },
  open(){ this.box.hidden=false; this.input.focus(); this.input.select(); if(this.input.value) this.run(); },
  close(){ this.box.hidden=true; this.clearHL(); this.matches=[]; this.idx=-1; },
  clearHL(){ document.querySelectorAll('.node.search-hit,.node.search-active').forEach(el=>el.classList.remove('search-hit','search-active')); },

  run(){
    const q=(this.input.value||'').trim().toLowerCase();
    this.matches=[]; this.idx=-1;
    if(!q){ this.count.textContent=''; this.clearHL(); return; }
    State.project.sheets.forEach(sh=>{
      for(const id in sh.nodes){ const n=sh.nodes[id];
        if((n.text||'').toLowerCase().indexOf(q)>=0 || (n.memo||'').toLowerCase().indexOf(q)>=0)
          this.matches.push({sheetId:sh.id, nodeId:id}); }
    });
    if(this.matches.length){ this.jumpTo(0); } else { this.count.textContent='0件'; this.clearHL(); }
  },
  updateCount(){ this.count.textContent=this.matches.length?((this.idx+1)+'/'+this.matches.length):'0件'; },
  next(){ if(!this.matches.length) return; this.jumpTo((this.idx+1)%this.matches.length); },
  prev(){ if(!this.matches.length) return; this.jumpTo((this.idx-1+this.matches.length)%this.matches.length); },
  jumpTo(i){
    this.idx=i; const m=this.matches[i];
    if(State.project.activeSheetId!==m.sheetId) State.setActiveSheet(m.sheetId);
    const n=State.activeSheet().nodes[m.nodeId];
    if(n){ const el=Nodes.els[m.nodeId]; const w=el?el.offsetWidth:n.w, h=el?el.offsetHeight:60; Canvas.centerOn(n.x+w/2,n.y+h/2); }
    this.highlightCurrent(); this.updateCount(); this.input.focus();
  },
  highlightCurrent(){
    this.clearHL();
    for(let k=0;k<this.matches.length;k++){ const m=this.matches[k];
      if(m.sheetId!==State.project.activeSheetId) continue;
      const el=Nodes.els[m.nodeId]; if(el){ el.classList.add('search-hit'); if(k===this.idx) el.classList.add('search-active'); } }
  }
};
</script>
