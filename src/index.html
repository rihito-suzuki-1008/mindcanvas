<!DOCTYPE html>
<html lang="ja">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <title>MindCanvas</title>
  <?!= include('css_main'); ?>
  <!-- CDN libraries -->
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-brand" viewBox="0 0 24 24"><path d="M12 3 21 12 12 21 3 12 12 3Z" fill="currentColor"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20h-5v-6H9v6H4v-8.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14M18 13l-6 6-6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-select" viewBox="0 0 24 24"><path d="M6 4 18 12 11.5 14.2 9 20 6 4Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-node" viewBox="0 0 24 24"><rect x="5" y="6" width="14" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
    <symbol id="i-section" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M8 8H4V4M5 8a8 8 0 1 1 2 8.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M16 8h4V4M19 8a8 8 0 1 0-2 8.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h14M5 5v14M12 5v14M19 5v14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="i-snap" viewBox="0 0 24 24"><path d="M8 4v5M16 4v5M8 15v5M16 15v5M4 8h5M15 8h5M4 16h5M15 16h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="9" y="9" width="6" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="i-fit" viewBox="0 0 24 24"><path d="M8 4H4v4M16 4h4v4M8 20H4v-4M16 20h4v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><circle cx="7" cy="12" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="7" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="17" cy="17" r="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 12H12m0 0V7h2.5M12 12v5h2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-freeform" viewBox="0 0 24 24"><rect x="4" y="5" width="7" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="6" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 14c2.2-1.4 3.8-3.4 4.6-6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="i-align-left" viewBox="0 0 24 24"><path d="M5 4v16M9 7h9M9 12h6M9 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-align-center" viewBox="0 0 24 24"><path d="M12 4v16M7 7h10M9 12h6M6 17h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-align-right" viewBox="0 0 24 24"><path d="M19 4v16M6 7h9M9 12h6M5 17h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-align-top" viewBox="0 0 24 24"><path d="M4 5h16M7 9v9M12 9v6M17 9v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-align-middle" viewBox="0 0 24 24"><path d="M4 12h16M7 7v10M12 9v6M17 6v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-align-bottom" viewBox="0 0 24 24"><path d="M4 19h16M7 6v9M12 9v6M17 5v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-distribute-h" viewBox="0 0 24 24"><path d="M4 5v14M20 5v14M8 12h2M14 12h2M11 7h2v10h-2z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-distribute-v" viewBox="0 0 24 24"><path d="M5 4h14M5 20h14M12 8v2M12 14v2M7 11h10v2H7z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-border" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 2"/></symbol>
    <symbol id="i-fill" viewBox="0 0 24 24"><path d="M6 13 13 6l5 5-7 7H6v-5Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M17 16c1.5 1.4 2.2 2.5 2.2 3.2a2.2 2.2 0 0 1-4.4 0c0-.7.7-1.8 2.2-3.2Z" fill="currentColor"/></symbol>
    <symbol id="i-text-color" viewBox="0 0 24 24"><path d="M6 19 12 5l6 14M8.2 14h7.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-group" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 10V6a2 2 0 0 1 2-2h4M14 4h4a2 2 0 0 1 2 2v4M20 14v4a2 2 0 0 1-2 2h-4M10 20H6a2 2 0 0 1-2-2v-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="i-ungroup" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  </svg>
  <div id="app">
    <!-- Home screen -->
    <section id="home" class="screen">
      <header class="home-head">
        <div class="brand"><svg class="i brand-mark" aria-hidden="true"><use href="#i-brand"></use></svg> MindCanvas</div>
        <button id="home-new" class="btn btn-primary"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg>新規プロジェクト</button>
      </header>
      <div id="home-list" class="home-list"></div>
      <div id="home-empty" class="home-empty" hidden>
        まだプロジェクトがありません。「新規プロジェクト」から始めましょう。
      </div>
    </section>

    <!-- Editor screen -->
    <section id="editor" class="screen" hidden>
      <header id="topbar">
        <button id="btn-home" class="icon-btn" title="ホームへ" aria-label="ホームへ"><svg class="i" aria-hidden="true"><use href="#i-home"></use></svg></button>
        <input id="project-name" class="project-name" />
        <div id="sheet-tabs" class="sheet-tabs"></div>
        <button id="sheet-add" class="icon-btn" title="シートを追加" aria-label="シートを追加"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        <div class="spacer"></div>
        <span id="sync-status" class="sync-status" title="保存状態">—</span>
        <button id="btn-search" class="icon-btn" title="検索 (Ctrl+F)" aria-label="検索"><svg class="i" aria-hidden="true"><use href="#i-search"></use></svg></button>
        <div class="menu-wrap">
          <button id="btn-export" class="btn">エクスポート <svg class="i tiny" aria-hidden="true"><use href="#i-chevron-down"></use></svg></button>
          <div id="export-menu" class="menu" hidden>
            <button data-export="png">PNG 画像</button>
            <button data-export="pdf">PDF</button>
            <button data-export="md">Markdown</button>
            <button data-export="mermaid">Mermaid</button>
          </div>
        </div>
      </header>

      <div id="toolbar">
        <button class="tool pen-tool" data-pen="tree" title="ツリーで作成" data-tip="新規ノード=ツリー" aria-label="ツリーで作成"><svg class="i" aria-hidden="true"><use href="#i-tree"></use></svg></button>
        <button class="tool pen-tool" data-pen="free" title="フリーフォームで作成" data-tip="新規ノード=フリー" aria-label="フリーフォームで作成"><svg class="i" aria-hidden="true"><use href="#i-freeform"></use></svg></button>
        <div class="tool-sep"></div>
        <button class="tool" data-tool="select" title="選択 (V)" data-tip="選択 (V)" aria-label="選択"><svg class="i" aria-hidden="true"><use href="#i-select"></use></svg></button>
        <button class="tool" data-tool="node" title="ノード追加 (N)" data-tip="ノード追加 (N)" aria-label="ノード追加"><svg class="i" aria-hidden="true"><use href="#i-node"></use></svg></button>
        <button class="tool" data-tool="section" title="セクション (S)" data-tip="セクション (S)" aria-label="セクション"><svg class="i" aria-hidden="true"><use href="#i-section"></use></svg></button>
        <div class="tool-sep"></div>
        <button class="tool" data-act="undo" title="元に戻す (Ctrl+Z)" data-tip="元に戻す" aria-label="元に戻す"><svg class="i" aria-hidden="true"><use href="#i-undo"></use></svg></button>
        <button class="tool" data-act="redo" title="やり直し (Ctrl+Shift+Z)" data-tip="やり直し" aria-label="やり直し"><svg class="i" aria-hidden="true"><use href="#i-redo"></use></svg></button>
        <div class="tool-sep"></div>
        <button class="tool" data-act="grid" title="グリッド表示切替" data-tip="グリッド表示切替" aria-label="グリッド表示切替"><svg class="i" aria-hidden="true"><use href="#i-grid"></use></svg></button>
        <button class="tool" data-act="snap" title="スナップ切替" data-tip="スナップ切替" aria-label="スナップ切替"><svg class="i" aria-hidden="true"><use href="#i-snap"></use></svg></button>
        <button class="tool" data-act="fit" title="全体表示 (Shift+1)" data-tip="全体表示" aria-label="全体表示"><svg class="i" aria-hidden="true"><use href="#i-fit"></use></svg></button>
      </div>

      <div id="align-bar" class="align-bar" hidden>
        <button data-align="left" title="左揃え" aria-label="左揃え"><svg class="i" aria-hidden="true"><use href="#i-align-left"></use></svg></button>
        <button data-align="hcenter" title="左右中央" aria-label="左右中央"><svg class="i" aria-hidden="true"><use href="#i-align-center"></use></svg></button>
        <button data-align="right" title="右揃え" aria-label="右揃え"><svg class="i" aria-hidden="true"><use href="#i-align-right"></use></svg></button>
        <button data-align="top" title="上揃え" aria-label="上揃え"><svg class="i" aria-hidden="true"><use href="#i-align-top"></use></svg></button>
        <button data-align="vcenter" title="上下中央" aria-label="上下中央"><svg class="i" aria-hidden="true"><use href="#i-align-middle"></use></svg></button>
        <button data-align="bottom" title="下揃え" aria-label="下揃え"><svg class="i" aria-hidden="true"><use href="#i-align-bottom"></use></svg></button>
        <span class="align-sep"></span>
        <button data-align="hdist" title="水平等間隔" aria-label="水平等間隔"><svg class="i" aria-hidden="true"><use href="#i-distribute-h"></use></svg></button>
        <button data-align="vdist" title="垂直等間隔" aria-label="垂直等間隔"><svg class="i" aria-hidden="true"><use href="#i-distribute-v"></use></svg></button>
        <span class="align-sep"></span>
        <button data-align="group" title="グループ化 (Ctrl+G)" aria-label="グループ化"><svg class="i" aria-hidden="true"><use href="#i-group"></use></svg></button>
        <button data-align="ungroup" title="グループ解除 (Ctrl+Shift+G)" aria-label="グループ解除"><svg class="i" aria-hidden="true"><use href="#i-ungroup"></use></svg></button>
      </div>

      <div id="style-bar" class="style-bar" hidden>
        <label title="枠線の色" aria-label="枠線の色"><svg class="i" aria-hidden="true"><use href="#i-border"></use></svg><input type="color" data-style="stroke"></label>
        <label title="塗りつぶしの色" aria-label="塗りつぶしの色"><svg class="i" aria-hidden="true"><use href="#i-fill"></use></svg><input type="color" data-style="fill"></label>
        <label title="文字の色" aria-label="文字の色"><svg class="i" aria-hidden="true"><use href="#i-text-color"></use></svg><input type="color" data-style="text"></label>
      </div>

      <div id="stage">
        <div id="canvas-bg"></div>
        <div id="world">
          <div id="sections-layer"></div>
          <svg id="edges-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
                      markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"></path>
              </marker>
            </defs>
            <g id="branch-g"></g>
            <g id="edges-g"></g>
          </svg>
          <div id="nodes-layer"></div>
        </div>
        <div id="overlay">
          <div id="marquee" class="marquee" hidden></div>
          <svg id="link-preview" class="link-preview" hidden>
            <path d="" stroke="#3b82f6" stroke-width="2" fill="none" stroke-dasharray="6 4"></path>
          </svg>
        </div>
        <div id="zoom-ctl" class="zoom-ctl">
          <button data-zoom="out" aria-label="ズームアウト"><svg class="i" aria-hidden="true"><use href="#i-minus"></use></svg></button>
          <span id="zoom-label">100%</span>
          <button data-zoom="in" aria-label="ズームイン"><svg class="i" aria-hidden="true"><use href="#i-plus"></use></svg></button>
        </div>
        <canvas id="minimap" width="200" height="140"></canvas>
        <div id="search-box" class="search-box" hidden>
          <input id="search-input" placeholder="ボード全体を検索…" />
          <span id="search-count" class="search-count"></span>
          <button id="search-prev" title="前へ" aria-label="前へ"><svg class="i" aria-hidden="true"><use href="#i-arrow-up"></use></svg></button>
          <button id="search-next" title="次へ" aria-label="次へ"><svg class="i" aria-hidden="true"><use href="#i-arrow-down"></use></svg></button>
          <button id="search-close" title="閉じる" aria-label="閉じる"><svg class="i" aria-hidden="true"><use href="#i-x"></use></svg></button>
        </div>
      </div>
    </section>

    <!-- New project modal -->
    <div id="modal-root"></div>
  </div>

  <!-- JS modules (inlined via include) -->
  <?!= include('js_state'); ?>
  <?!= include('js_storage'); ?>
  <?!= include('js_history'); ?>
  <?!= include('js_canvas'); ?>
  <?!= include('js_nodes'); ?>
  <?!= include('js_edges'); ?>
  <?!= include('js_tree'); ?>
  <?!= include('js_sections'); ?>
  <?!= include('js_selection'); ?>
  <?!= include('js_minimap'); ?>
  <?!= include('js_search'); ?>
  <?!= include('js_export'); ?>
  <?!= include('js_shortcuts'); ?>
  <?!= include('js_home'); ?>
  <?!= include('js_app'); ?>
  <script> App.init(); </script>
</body>
</html>
