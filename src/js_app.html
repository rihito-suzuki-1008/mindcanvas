<script>
const App = {
  screen:'home', tool:'select', penKind:'tree', spaceDown:false, clipboard:null, clipboardText:'',
  imageMaxSide:1600, imageMaxBytes:8*1024*1024,

  init(){
    Canvas.init(); Nodes.init(); Sections.init(); Edges.init(); Minimap.init(); Search.init(); Importer.init(); Shortcuts.init(); Home.init();
    this.wireUI();
    Store.initBackend(()=>Home.show());
  },

  /* ---------- routing ---------- */
  enterEditor(p){
    Nodes.commitEdit();
    State.project=p; this.migrateProject(p); History.reset(); Selection.clear(); Edges.selectedId=null;
    this.penKind = (p.penKind==='free') ? 'free' : 'tree';
    this.screen='editor';
    document.getElementById('home').hidden=true;
    document.getElementById('editor').hidden=false;
    document.getElementById('project-name').value=p.name||'';
    this.setTool('select'); this.updateToolbar();
    this.render();
    Canvas.fit();
    Store.setStatus(Store.backend==='local'?'local':'synced');
  },
  // backfill node.kind / project.penKind for projects created before node-level mode
  migrateProject(p){
    if(!p||!p.sheets) return;
    const defKind = (p.mode==='freeform') ? 'free' : 'tree';
    p.sheets.forEach(sh=>{ if(sh&&sh.nodes){ for(const id in sh.nodes){ const n=sh.nodes[id]; if(!n.kind) n.kind=defKind; } } });
    if(p.penKind!=='free' && p.penKind!=='tree') p.penKind=defKind;
  },
  setPenKind(kind){
    this.penKind = (kind==='free') ? 'free' : 'tree';
    if(State.project){ State.project.penKind=this.penKind; Store.scheduleSave(); }
    this.updateToolbar();
  },
  openProject(id){ Store.loadProject(id,(p)=>{ if(p) this.enterEditor(p); else this.toast('プロジェクトを開けませんでした'); }); },
  showHome(){ Nodes.commitEdit(); this.closeMenus(); Home.show(); },

  /* ---------- render ---------- */
  render(){
    if(!State.project) return;
    const sheet=State.activeSheet(); if(!sheet) return;
    // tree-kind nodes are auto-laid-out; free-kind nodes stay where they are (both coexist on one sheet)
    Tree.computeVisibility(); Nodes.render(sheet); Tree.relayout(); Nodes.applyPositions();
    Edges.renderBranches(sheet);
    Edges.render(sheet); Sections.render(sheet);
    Canvas.apply();
    this.updateSheetTabs(); this.updateAlignBar(); this.updateStyleBar(); History.update();
  },

  /* ---------- tools / toolbar ---------- */
  setTool(t){
    this.tool=t;
    const st=Canvas.stage; st.classList.toggle('tool-node',t==='node'||t==='plainText'); st.classList.toggle('tool-section',t==='section');
    this.updateToolbar();
  },
  updateToolbar(){
    document.querySelectorAll('.tool[data-tool]').forEach(b=>b.classList.toggle('active', b.dataset.tool===this.tool));
    document.querySelectorAll('.tool[data-pen]').forEach(b=>b.classList.toggle('active', b.dataset.pen===this.penKind));
    const pf=State.prefs();
    const g=document.querySelector('.tool[data-act="grid"]'), s=document.querySelector('.tool[data-act="snap"]');
    if(g) g.classList.toggle('active', !!pf.grid);
    if(s) s.classList.toggle('active', !!pf.snap);
  },
  updateAlignBar(){ document.getElementById('align-bar').hidden = Selection.nodes.size<2; },
  updateStyleBar(){
    const bar=document.getElementById('style-bar'); if(!bar) return;
    const any=Selection.nodes.size || Selection.sections.size;
    bar.hidden=!any;
    if(!any) return;
    bar.querySelectorAll('input[data-style]').forEach(input=>{
      const color=Selection.styleValue(input.dataset.style);
      input.value=color;
      input.parentNode.style.color=color;
    });
  },
  closeMenus(){ const m=document.getElementById('export-menu'); if(m) m.hidden=true; },

  /* ---------- images ---------- */
  chooseImage(){
    const input=document.getElementById('image-upload');
    if(!input) return;
    input.value='';
    input.click();
  },
  async onImagePicked(e){
    const file=e.target.files && e.target.files[0];
    if(!file) return;
    if(!/^image\//.test(file.type)){ this.toast('画像ファイルを選択してください'); return; }
    if(file.size>this.imageMaxBytes){ this.toast('画像は8MB以下にしてください'); return; }
    try{
      const asset=await this.prepareImageAsset(file);
      const center=this.stageCenterWorld();
      const snap=mcClone(State.project);
      const w=Canvas.snap(asset.w), h=Canvas.snap(asset.h);
      const n=State.addNode({
        kind:'free', type:'image', text:asset.name, memo:'', parentId:null, collapsed:false,
        x:Canvas.snap(center.x-w/2), y:Canvas.snap(center.y-h/2), w:w, h:h,
        image:{ src:asset.src, name:asset.name, mime:asset.mime, originalSize:file.size, width:asset.naturalW, height:asset.naturalH }
      });
      History.pushSnapshot(snap); State.touchRender();
      Selection.selectNode(n.id); Nodes.refreshSelection();
      this.toast('画像を追加しました');
    }catch(err){
      this.toast('画像を読み込めませんでした');
    }
  },
  stageCenterWorld(){
    const r=Canvas.rect();
    return Canvas.screenToWorld(r.left+r.width/2, r.top+r.height/2);
  },
  readFileAsDataURL(file){
    return new Promise((resolve,reject)=>{
      const reader=new FileReader();
      reader.onload=()=>resolve(reader.result);
      reader.onerror=()=>reject(reader.error);
      reader.readAsDataURL(file);
    });
  },
  loadImage(src){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>resolve(img);
      img.onerror=reject;
      img.src=src;
    });
  },
  async prepareImageAsset(file){
    const src=await this.readFileAsDataURL(file);
    const isRaster=/^image\/(png|jpe?g|webp)$/i.test(file.type);
    const img=await this.loadImage(src);
    const naturalW=img.naturalWidth||img.width||State.FREE_NODE_W;
    const naturalH=img.naturalHeight||img.height||State.FREE_NODE_H;
    const fitScale=Math.min(1, this.imageMaxSide/Math.max(naturalW,naturalH));
    const outW=Math.max(1, Math.round(naturalW*fitScale));
    const outH=Math.max(1, Math.round(naturalH*fitScale));
    const displayScale=Math.min(1, 320/outW, 240/outH);
    const w=Math.max(State.MIN_NODE_W, Math.round(outW*displayScale));
    const h=Math.max(State.MIN_NODE_H, Math.round(outH*displayScale));
    if(!isRaster || fitScale>=1) return { src:src, name:file.name, mime:file.type, w:w, h:h, naturalW:naturalW, naturalH:naturalH };
    const canvas=document.createElement('canvas');
    canvas.width=outW; canvas.height=outH;
    const ctx=canvas.getContext('2d');
    ctx.drawImage(img,0,0,outW,outH);
    const mime=file.type==='image/png'?'image/png':'image/jpeg';
    return { src:canvas.toDataURL(mime, .88), name:file.name, mime:mime, w:w, h:h, naturalW:naturalW, naturalH:naturalH };
  },

  /* ---------- sheet tabs ---------- */
  updateSheetTabs(){
    const wrap=document.getElementById('sheet-tabs'); if(!wrap) return; wrap.innerHTML='';
    State.project.sheets.forEach(sh=>{
      const t=document.createElement('button'); t.className='sheet-tab'+(sh.id===State.project.activeSheetId?' active':'');
      t.innerHTML='<span class="nm">'+escAttr(sh.name)+'</span>'+(State.project.sheets.length>1?'<span class="x">'+iconSvg('x','tiny')+'</span>':'');
      t.querySelector('.nm').onclick=()=>State.setActiveSheet(sh.id);
      t.querySelector('.nm').ondblclick=async()=>{ const v=await Dialog.prompt('シート名',sh.name); if(v!=null) State.renameSheet(sh.id,v.trim()||sh.name); };
      const x=t.querySelector('.x'); if(x) x.onclick=async(e)=>{ e.stopPropagation();
        const ok=await Dialog.confirm('シートを削除', 'シート「'+sh.name+'」を削除します。', {danger:true, okText:'削除'});
        if(ok) State.removeSheet(sh.id);
      };
      wrap.appendChild(t);
    });
  },

  /* ---------- clipboard ---------- */
  copy(){
    const ids=Selection.nodeIds(); if(!ids.length) return;
    const s=State.activeSheet(); const idset=new Set(ids);
    this.clipboard={ nodes:ids.map(id=>mcClone(s.nodes[id])),
      edges:Object.values(s.edges).filter(e=>idset.has(e.from)&&idset.has(e.to)).map(mcClone) };
    this.clipboardText=this.clipboard.nodes.map(n=>Exporter.label(n)).join('\n');
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(this.clipboardText).catch(()=>{});
    this.toast(ids.length+'件をコピー');
  },
  cut(){ this.copy(); Selection.deleteSelected(); },
  async paste(){
    const target=this.treePasteTarget();
    if(target){
      const sysText=await this.readClipboardText();
      if(sysText && sysText!==this.clipboardText){ this.pasteTextAsChildren(target, sysText); return; }
      if(this.clipboard&&this.clipboard.nodes&&this.clipboard.nodes.length){ this.pasteNodesAsChildren(target); return; }
      if(sysText){ this.pasteTextAsChildren(target, sysText); return; }
    }
    if(!this.clipboard||!this.clipboard.nodes.length) return;
    const snap=mcClone(State.project); const s=State.activeSheet(); const off=30;
    const map={}, gmap={}; this.clipboard.nodes.forEach(n=>{ map[n.id]=uid('n'); });
    this.clipboard.nodes.forEach(n=>{ const nn=mcClone(n); nn.id=map[n.id]; nn.x+=off; nn.y+=off;
      nn.parentId=(n.parentId&&map[n.parentId])?map[n.parentId]:null;
      if(n.groupId){ gmap[n.groupId]=gmap[n.groupId]||uid('g'); nn.groupId=gmap[n.groupId]; }
      delete nn._fresh; delete nn._hidden; s.nodes[nn.id]=nn; });
    this.clipboard.edges.forEach(e=>{ if(map[e.from]&&map[e.to]){ const ne=mcClone(e); ne.id=uid('e'); ne.from=map[e.from]; ne.to=map[e.to]; s.edges[ne.id]=ne; } });
    History.pushSnapshot(snap); State.touchRender();
    Selection.clear(); Object.values(map).forEach(id=>Selection.nodes.add(id)); Selection.refresh();
    this.toast('貼り付けました');
  },
  treePasteTarget(){
    if(!State.project) return null;
    const ids=Selection.nodeIds();
    if(ids.length!==1) return null;
    return Tree.isTreeNode(State.getNode(ids[0])) ? ids[0] : null;
  },
  async readClipboardText(){
    if(!navigator.clipboard || !navigator.clipboard.readText) return '';
    try{ return (await navigator.clipboard.readText()) || ''; }catch(e){ return ''; }
  },
  pasteTextAsChildren(parentId,text){
    const lines=String(text||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
    if(!lines.length) return;
    const parent=State.getNode(parentId); if(!parent) return;
    const snap=mcClone(State.project), made=[];
    if(parent.collapsed) parent.collapsed=false;
    const sibs=Tree.childrenOf(parentId);
    let y=sibs.length ? (sibs[sibs.length-1].y + Tree.H(sibs[sibs.length-1]) + State.V_GAP) : parent.y;
    lines.forEach(line=>{
      const n=State.addNode({ parentId:parentId, x:parent.x+Tree.W(parent)+State.H_GAP, y:y, text:line });
      made.push(n.id); y+=Tree.H(n)+State.V_GAP;
    });
    History.pushSnapshot(snap); State.touchRender();
    Selection.clear(); made.forEach(id=>Selection.nodes.add(id)); Selection.refresh();
    this.toast(made.length+'件を子ノードに追加しました');
  },
  pasteNodesAsChildren(parentId){
    if(!this.clipboard||!this.clipboard.nodes.length) return;
    const parent=State.getNode(parentId); if(!parent) return;
    const snap=mcClone(State.project), s=State.activeSheet(), idset=new Set(this.clipboard.nodes.map(n=>n.id));
    const map={}, made=[]; this.clipboard.nodes.forEach(n=>{ map[n.id]=uid('n'); });
    if(parent.collapsed) parent.collapsed=false;
    const roots=this.clipboard.nodes.filter(n=>!n.parentId || !idset.has(n.parentId)).sort((a,b)=>a.y-b.y || a.x-b.x);
    const rootSet=new Set(roots.map(n=>n.id));
    const sibs=Tree.childrenOf(parentId);
    let rootY=sibs.length ? (sibs[sibs.length-1].y + Tree.H(sibs[sibs.length-1]) + State.V_GAP) : parent.y;
    const rootYByOld={}; roots.forEach(r=>{ rootYByOld[r.id]=rootY; rootY+=Tree.H(r)+State.V_GAP; });
    this.clipboard.nodes.forEach(n=>{
      const nn=mcClone(n); nn.id=map[n.id]; nn.groupId=null;
      nn.parentId=rootSet.has(n.id) ? parentId : (n.parentId&&map[n.parentId]?map[n.parentId]:parentId);
      if(rootSet.has(n.id)){ nn.x=parent.x+Tree.W(parent)+State.H_GAP; nn.y=rootYByOld[n.id]; }
      delete nn._fresh; delete nn._hidden; s.nodes[nn.id]=nn; made.push(nn.id);
    });
    this.clipboard.edges.forEach(e=>{ if(map[e.from]&&map[e.to]){ const ne=mcClone(e); ne.id=uid('e'); ne.from=map[e.from]; ne.to=map[e.to]; s.edges[ne.id]=ne; } });
    History.pushSnapshot(snap); State.touchRender();
    Selection.clear(); made.forEach(id=>Selection.nodes.add(id)); Selection.refresh();
    this.toast(made.length+'件を子ノードに追加しました');
  },

  /* ---------- toast ---------- */
  toast(msg){
    let t=document.getElementById('mc-toast');
    if(!t){ t=document.createElement('div'); t.id='mc-toast'; t.className='toast'; document.body.appendChild(t); }
    t.textContent=msg; t.classList.add('show'); clearTimeout(this._tt);
    this._tt=setTimeout(()=>t.classList.remove('show'),1600);
  },

  /* ---------- UI wiring ---------- */
  wireUI(){
    document.getElementById('btn-home').onclick=()=>this.showHome();
    document.getElementById('btn-search').onclick=()=>Search.open();
    document.getElementById('sheet-add').onclick=()=>State.addSheet();

    const pn=document.getElementById('project-name');
    pn.addEventListener('input',()=>{ if(State.project){ State.project.name=pn.value; Store.scheduleSave(); } });

    // toolbar
    document.querySelectorAll('.tool[data-pen]').forEach(b=>b.onclick=()=>this.setPenKind(b.dataset.pen));
    document.querySelectorAll('.tool[data-tool]').forEach(b=>b.onclick=()=>this.setTool(b.dataset.tool));
    document.querySelector('.tool[data-act="undo"]').onclick=()=>History.doUndo();
    document.querySelector('.tool[data-act="redo"]').onclick=()=>History.doRedo();
    document.querySelector('.tool[data-act="fit"]').onclick=()=>Canvas.fit();
    document.querySelector('.tool[data-act="image"]').onclick=()=>this.chooseImage();
    document.querySelector('.tool[data-act="grid"]').onclick=()=>{ const pf=State.prefs(); pf.grid=!pf.grid; Canvas.apply(); this.updateToolbar(); Store.scheduleSave(); };
    document.querySelector('.tool[data-act="snap"]').onclick=()=>{ const pf=State.prefs(); pf.snap=!pf.snap; this.updateToolbar(); Store.scheduleSave(); };
    const imageInput=document.getElementById('image-upload');
    if(imageInput) imageInput.addEventListener('change',(e)=>this.onImagePicked(e));

    // align bar
    document.querySelectorAll('#align-bar [data-align]').forEach(b=>b.onclick=()=>{
      const a=b.dataset.align;
      if(a==='group') Selection.group(); else if(a==='ungroup') Selection.ungroup(); else Selection.align(a);
    });
    document.querySelectorAll('#style-bar input[data-style]').forEach(input=>{
      input.addEventListener('change',()=>Selection.applyStyle(input.dataset.style, input.value));
    });

    // export menu
    const eb=document.getElementById('btn-export'), em=document.getElementById('export-menu');
    eb.onclick=(e)=>{ e.stopPropagation(); em.hidden=!em.hidden; };
    em.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{ em.hidden=true; Exporter.run(b.dataset.export); });
    document.addEventListener('click',(e)=>{ if(!e.target.closest('.menu-wrap')) em.hidden=true; });

    // stage interactions
    const stage=Canvas.stage;
    stage.addEventListener('pointerdown',(e)=>this.onStageDown(e));
    stage.addEventListener('dblclick',(e)=>{
      if(this.screen!=='editor') return;
      if(e.target.closest('.node')||e.target.closest('.section-title')) return;
      const w=Canvas.screenToWorld(e.clientX,e.clientY); Nodes.createAt(w.x,w.y);
    });
  },

  onStageDown(e){
    if(this.screen!=='editor') return;
    if(Nodes.editingId) Nodes.commitEdit();
    if(this.spaceDown || e.button===1){ Canvas.startPan(e); return; }
    if(e.button!==0) return;
    if(this.tool==='node'){ const w=Canvas.screenToWorld(e.clientX,e.clientY); this.setTool('select'); Nodes.createAt(w.x,w.y); return; }
    if(this.tool==='plainText'){ const w=Canvas.screenToWorld(e.clientX,e.clientY); this.setTool('select'); Nodes.createAt(w.x,w.y,{kind:'free', type:'plainText', w:220, h:0, text:''}); return; }
    if(this.tool==='section'){ Sections.startDraw(e); return; }
    Edges.deselect(); Selection.startMarquee(e);
  }
};
</script>
